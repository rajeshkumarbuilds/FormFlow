        <!-- Page References / Progress -->
        <section class="pagesRef">

        <!-- Current Page Form -->
        <section class="personalinfo">
            <h2>Education Information</h2>
            <p>Please enter your educational details.</p>

           <form id="educationForm">

    <div class="form-group">
        <label for="qualification">Highest Qualification</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select qualification</option>
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="diploma">Diploma</option>
            <option value="graduation">Graduation</option>
            <option value="post-graduation">Post Graduation</option>
        </select>
    </div>

    <div class="form-group">
        <label for="institution">School / College Name</label>
        <input type="text" id="institution" name="institution" required>
    </div>

    <div class="form-group">
        <label for="course">Course / Degree</label>
        <input type="text" id="course" name="course" required>
    </div>

    <div class="form-group">
        <label for="specialization">Specialization</label>
        <input type="text" id="specialization" name="specialization">
    </div>

    <div class="form-group">
        <label for="passingYear">Passing Year</label>
        <input 
            type="number" 
            id="passingYear" 
            name="passingYear"
            min="1950"
            max="2026"
            required
        >
    </div>

    <div class="form-group">
        <label for="percentage">Percentage / CGPA</label>
        <input 
            type="number" 
            id="percentage" 
            name="percentage"
            step="0.01"
            min="0"
            max="100"
            required
        >
    </div>

    <div class="btns">
        <button type="submit" class="save" id="save">Save</button>

            <a class="next" id="next" href="document.html" aria-disabled="true">

    </div>

</form>
